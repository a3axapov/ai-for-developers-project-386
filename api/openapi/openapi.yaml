openapi: 3.0.0
info:
  title: Calendar API
  version: 0.0.0
tags:
  - name: Owner
  - name: Public
paths:
  /api/booking-attempts/{attemptId}:
    get:
      operationId: getBookingAttempt
      description: Safely read an attempt with its original Bearer secret, without submitting it. Missing attempts and invalid secrets give the same neutral 410; saved outcomes precede public booking restrictions.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingAttemptResult'
        '410':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Public
  /api/booking-attempts/{attemptId}/submit:
    post:
      operationId: submitBookingAttempt
      description: Submit immutable prepared data with its Bearer secret. First creation returns 201, successful replay 200 with the current booking. Definite refusals are saved. No request body is accepted.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmittedBookingAttempt'
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmittedBookingAttempt'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Public
  /api/bookings/{accessToken}:
    get:
      operationId: getBookingResult
      description: Read the current booking using its independent secret link. Unknown links return a neutral BOOKING_NOT_FOUND. Public booking settings do not restrict existing results.
      parameters:
        - name: accessToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Public
  /api/bookings/{accessToken}/calendar.ics:
    get:
      operationId: downloadBookingCalendar
      description: Download a private RFC 5545 snapshot of a PENDING or CONFIRMED booking, including past confirmed meetings. Unknown links are neutral; rejected or cancelled bookings return ACTION_NOT_ALLOWED. The absolute result link uses the configured trusted application origin, never request headers. No guest contacts are included.
      parameters:
        - name: accessToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
                enum:
                  - attachment; filename="booking.ics"
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
            Referrer-Policy:
              required: true
              schema:
                type: string
                enum:
                  - no-referrer
          content:
            text/calendar; charset=utf-8:
              schema:
                type: string
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Public
  /api/bookings/{accessToken}/cancel:
    post:
      operationId: cancelGuestBooking
      description: Explicitly withdraw or cancel the shown booking before its start. An already cancelled booking returns its current result without mutation.
      parameters:
        - name: accessToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetails'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Client error
          content:
            application/json:
              schema:
