  /api/owner/bookings:
    get:
      operationId: listOwnerBookings
      description: All types in ascending actual start order. Upcoming is PENDING or CONFIRMED with start strictly after now; history is its complement. Status only narrows the selected view.
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: status
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerBookingList'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
