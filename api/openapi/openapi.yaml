  /api/owner/bookings/{id}/reschedule:
    post:
      operationId: rescheduleOwnerBooking
      description: Atomically move a future PENDING/CONFIRMED booking of an active type to a strictly future available start. Retain saved conditions, status and result link; exclude own occupancy. Recheck the original start and version under the shared state lock.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
