  /api/owner/bookings/{id}/reject:
    post:
      operationId: rejectOwnerBooking
      description: Reject a PENDING booking strictly before start. The UI must explicitly confirm that its occupancy is released and the decision cannot be undone; no textual reason is required. A free slot is not guaranteed.
