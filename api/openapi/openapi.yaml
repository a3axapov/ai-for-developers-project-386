components:
  schemas:
    AffectedBooking:
      type: object
      required:
        - id
        - meetingTypeId
        - title
        - guestName
        - startsAt
        - endsAt
        - status
        - version
      properties:
        id:
          type: string
        meetingTypeId:
          type: string
        title:
          type: string
        guestName:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
        version:
          type: integer
          format: int64
      description: Impact preview only, without result links or attempt credentials. Availability changes show newly invalid future active bookings; time blocks show all overlapping unexpired pending requests, even if already outside availability. Status/version/time changes require fresh consent.
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        currentProfile:
          $ref: '#/components/schemas/OwnerProfile'
        currentBooking:
          $ref: '#/components/schemas/BookingDetails'
        currentMeetingType:
          $ref: '#/components/schemas/MeetingType'
        currentOutOfOffice:
          $ref: '#/components/schemas/OutOfOffice'
        currentTimeBlock:
          $ref: '#/components/schemas/TimeBlock'
        currentConditions:
          $ref: '#/components/schemas/PublicMeetingType'
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        affectedBookings:
          type: array
          items:
            $ref: '#/components/schemas/AffectedBooking'
        confirmationToken:
          type: string
    ArchiveMeetingTypeCommand:
      type: object
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          format: int64
    BookingAttemptResult:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - PREPARED
            - SUCCEEDED
            - FAILED
        booking:
          $ref: '#/components/schemas/BookingDetails'
        resultUrl:
          type: string
        error:
          $ref: '#/components/schemas/ApiError'
      description: Read-only saved attempt outcome. PREPARED has no booking; SUCCEEDED includes booking and resultUrl; FAILED includes the saved definite error.
    BookingDecisionCommand:
      type: object
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
    BookingDetails:
      type: object
      required:
        - id
        - meetingTypeId
        - ownerName
        - ownerTimeZone
        - title
        - description
        - durationMinutes
        - requiresApproval
        - startsAt
        - endsAt
        - status
        - guestName
        - guestEmail
        - comment
        - version
        - allowedActions
      properties:
        id:
          type: string
        meetingTypeId:
          type: string
        ownerName:
          type: string
        ownerTimeZone:
          type: string
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
        requiresApproval:
          type: boolean
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - CONFIRMED
            - PENDING
            - REJECTED
            - CANCELLED
        rejectionReason:
          type: string
          enum:
            - APPROVAL_EXPIRED
        guestName:
          type: string
        guestEmail:
          type: string
        comment:
          type: string
        version:
          type: integer
          format: int64
        allowedActions:
          type: array
          items:
            type: string
          description: Contains export for PENDING or CONFIRMED (including past CONFIRMED), and cancel only strictly before start. Rejected/cancelled bookings have no actions.
      description: Saved booking conditions and contacts with current time, status and version.
    BookingEntry:
      type: object
      required:
        - bookingUrl
      properties:
        bookingUrl:
          type: string
    CreateMeetingTypeCommand:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          description: 'Immutable, case-sensitive ID: 1–64 ASCII letters, digits or hyphens.'
        title:
          type: string
          description: Nonempty title after collapsing Unicode space separators and trimming. Nonprintable characters are rejected.
        description:
          type: string
          description: At least 20 counted Unicode code points after normalizing spaces per line. Internal newlines remain; newlines, control and invisible characters do not count toward the minimum.
        durationMinutes:
          type: integer
          format: int32
        requiresApproval:
          type: boolean
          default: false
    CreateOutOfOfficeCommand:
      type: object
      required:
        - startDate
        - endDate
      properties:
        startDate:
          type: string
