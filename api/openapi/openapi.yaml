openapi: 3.0.0
info:
  title: Calendar API
  version: 0.0.0
tags:
  - name: Owner
  - name: Public
paths:
  /api/health:
    get:
      operationId: getHealth
      description: Check that the application is running.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/owner/meeting-types:
    post:
      operationId: createMeetingType
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingTypeCommand'
    get:
      operationId: listMeetingTypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeList'
      tags:
        - Owner
  /api/owner/meeting-types/{id}:
    get:
      operationId: getMeetingType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Owner
  /api/owner/operations/{key}:
    get:
      operationId: getOwnerOperation
      description: Recover the saved result without executing the command again.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerOperationResult'
        '410':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Owner
  /api/owner/profile:
    get:
      operationId: getOwnerProfile
      description: Read the calendar owner's profile.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
      tags:
        - Owner
    put:
      operationId: updateOwnerProfile
      description: Edit name and username without changing booking state. The UI must explicitly confirm the published-link warning before a username change. Uses the shared owner operation key space.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCommand'
  /api/owner/public-booking:
    put:
      operationId: setPublicBooking
      description: Explicitly enable or disable public booking, using the shown profile version. An invalid Idempotency-Key returns 400 MALFORMED_REQUEST without changing state or saving an outcome.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicBookingCommand'
  /api/public/booking-entry/current:
    get:
      operationId: getBookingEntry
      description: Find the current general booking page, including when booking is disabled.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingEntry'
      tags:
        - Public
  /api/public/{username}:
    get:
      operationId: getPublicBookingPage
      description: Read the general public booking page.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBookingPage'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Public
  /api/public/{username}/meeting-types/{id}:
    get:
      operationId: getPublicMeetingType
      description: Read explicitly selected conditions. Unknown username/ID returns 404 even when booking is disabled.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMeetingTypePage'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Public
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        currentProfile:
          $ref: '#/components/schemas/OwnerProfile'
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    BookingEntry:
      type: object
      required:
        - bookingUrl
      properties:
        bookingUrl:
          type: string
    CreateMeetingTypeCommand:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          description: 'Immutable, case-sensitive ID: 1–64 ASCII letters, digits or hyphens.'
        title:
          type: string
          description: Nonempty title after collapsing Unicode space separators and trimming. Nonprintable characters are rejected.
        description:
          type: string
          description: At least 20 counted Unicode code points after normalizing spaces per line. Internal newlines remain; newlines, control and invisible characters do not count toward the minimum.
        durationMinutes:
          type: integer
          format: int32
        requiresApproval:
          type: boolean
          default: false
    DateOverride:
      type: object
      required:
        - date
        - intervals
      properties:
        date:
          type: string
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/WorkingInterval'
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
          description: The application is ready to accept requests.
      description: Application health response.
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
      description: 'Transport-safe operation key: 1 to 128 ASCII letters, digits, underscores or hyphens.'
    MeetingType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
        - requiresApproval
        - timeZone
        - version
        - archived
        - days
        - dateOverrides
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
        requiresApproval:
          type: boolean
        timeZone:
          type: string
        version:
          type: integer
          format: int64
        archived:
          type: boolean
        days:
          type: array
          items:
            $ref: '#/components/schemas/WorkingDay'
        dateOverrides:
          type: array
          items:
            $ref: '#/components/schemas/DateOverride'
    MeetingTypeList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MeetingType'
    OwnerOperationResult:
      type: object
      required:
        - statusCode
      properties:
        statusCode:
          type: integer
          format: int32
        profile:
          $ref: '#/components/schemas/OwnerProfile'
        meetingType:
          $ref: '#/components/schemas/MeetingType'
        error:
          $ref: '#/components/schemas/ApiError'
      description: The saved, definite result of an owner command. Exactly one of profile, meetingType or error is present.
    OwnerProfile:
      type: object
      required:
        - name
        - username
        - timeZone
        - bookingEnabled
        - version
        - bookingUrl
      properties:
        name:
          type: string
        username:
          type: string
        timeZone:
          type: string
        bookingEnabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
        bookingUrl:
          type: string
          description: Same-origin public booking page path.
      description: The single calendar owner's current profile.
    ProfileCommand:
      type: object
      required:
        - name
        - username
        - expectedVersion
      properties:
        name:
          type: string
          description: 1–100 Unicode code points after trimming and collapsing Unicode space separators. Control, nonprintable and invisible control characters are rejected before normalization.
        username:
          type: string
          description: Trim edge space separators and lowercase; 3–30 ASCII letters, digits or hyphens, with alphanumeric boundaries.
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
    PublicBookingCommand:
      type: object
      required:
        - enabled
        - expectedVersion
      properties:
        enabled:
          type: boolean
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
    PublicBookingPage:
      type: object
      required:
        - ownerName
        - ownerTimeZone
        - state
      properties:
        ownerName:
          type: string
        ownerTimeZone:
          type: string
        state:
          type: string
          enum:
            - BOOKING_DISABLED
            - OPEN
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicMeetingType'
          description: Present only when OPEN; choosing even one item requires an explicit action.
    PublicMeetingType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
        - requiresApproval
        - timeZone
        - conditionsToken
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
        requiresApproval:
          type: boolean
        timeZone:
          type: string
        conditionsToken:
          type: string
          description: Content-derived token over title, description, durationMinutes and requiresApproval only.
    PublicMeetingTypePage:
      type: object
      required:
        - ownerName
        - ownerTimeZone
        - state
      properties:
        ownerName:
          type: string
        ownerTimeZone:
          type: string
        state:
          type: string
          enum:
            - BOOKING_DISABLED
            - OPEN
        meetingType:
          allOf:
            - $ref: '#/components/schemas/PublicMeetingType'
          description: Present only when OPEN.
    WorkingDay:
      type: object
      required:
        - day
        - intervals
      properties:
        day:
          type: string
          enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/WorkingInterval'
    WorkingInterval:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
        end:
          type: string
