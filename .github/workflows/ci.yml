name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Setup, sequential browser tests and image checks need ~27 min at the #28 CI pace.
    # Keep a bounded budget with headroom for runner/bootstrap variation.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.6
      - run: mise run test:browser:install
      - run: mise run check
      - run: mise run image:build
      - run: mise run image:test
